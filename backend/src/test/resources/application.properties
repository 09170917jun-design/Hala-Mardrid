# 테스트는 인메모리 H2(MySQL 모드)를 사용한다. 실제 DB에 접속하지 않는다.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=test-secret-test-secret-test-secret-1234
app.jwt.access-minutes=15
app.jwt.refresh-days=14
app.cookie.secure=false

app.kakao.client-id=test-client-id
app.kakao.client-secret=test-client-secret
app.kakao.allowed-redirect-uris=http://localhost:5173/auth/kakao/callback
