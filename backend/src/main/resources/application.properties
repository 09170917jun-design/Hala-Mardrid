spring.application.name=backend
server.port=${PORT:8080}

# 로컬에서는 backend/.env를 읽는다. 배포(Render)에서는 같은 이름의 환경변수를 사용한다.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 스키마는 엔티티 기준으로 자동 갱신한다. (규모가 커지면 Flyway 등 마이그레이션 도구로 교체)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 인증
app.jwt.secret=${JWT_SECRET}
app.jwt.access-minutes=15
app.jwt.refresh-days=14
# 로컬(http)에서는 COOKIE_SECURE=false, 배포(https)에서는 기본값 true
app.cookie.secure=${COOKIE_SECURE:true}

# 카카오 로그인 (REST API 키 / 클라이언트 시크릿). 비어 있으면 카카오 로그인 API는 503을 반환한다.
app.kakao.client-id=${KAKAO_CLIENT_ID:}
app.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
# 프론트가 보낼 수 있는 리다이렉트 주소 허용 목록 (카카오 콘솔에 등록한 값과 같아야 한다)
app.kakao.allowed-redirect-uris=${KAKAO_ALLOWED_REDIRECT_URIS:http://localhost:5173/auth/kakao/callback,https://hala-mardrid.vercel.app/auth/kakao/callback}
